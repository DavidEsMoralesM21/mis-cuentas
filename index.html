<script>
/* Aplica el tema antes de pintar para evitar destellos */
(function(){ var t='auto'; try{ t=JSON.parse(localStorage.getItem('mc_theme')||'"auto"'); }catch(e){}
  var d = t==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : t;
  document.documentElement.setAttribute('data-theme', d); })();
</script>
<style>
:root,[data-theme=light]{
  --bg:#f3f5f4; --card:#fff; --ink:#14201d; --muted:#67746f; --line:#e2e7e5;
  --brand:#0f766e; --brand-ink:#fff; --brand-soft:#d9f0ec;
  --in:#13795b; --out:#c0392b; --warn:#a86200; --warn-soft:#fff2d9; --move:#4b5bb3;
  --hero:linear-gradient(140deg,#0f766e,#115e59 55%,#134e4a); --hero-ink:#fff; --hero-btn:#fff; --hero-btn-ink:#0f766e;
  --fab:linear-gradient(135deg,#0f766e,#14b8a6); --bar:linear-gradient(90deg,#0f766e,#14b8a6);
  --toast:#14201d; --toast-ink:#f3f5f4;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(16,40,35,.06);
}
[data-theme=dark]{
  --bg:#0d1312; --card:#161f1d; --ink:#e7eeec; --muted:#93a19d; --line:#25302d;
  --brand:#2bb3a3; --brand-ink:#04211d; --brand-soft:#163833; --in:#4cc79b; --out:#f0827c;
  --warn:#f2b552; --warn-soft:#3a2d12; --move:#9aa6f0;
  --hero:linear-gradient(140deg,#115e59,#0f3f3b); --hero-ink:#eafaf7; --hero-btn:#eafaf7; --hero-btn-ink:#0f4f49;
  --fab:linear-gradient(135deg,#1f9488,#2bb3a3); --bar:linear-gradient(90deg,#1f9488,#5eead4);
  --toast:#e7eeec; --toast-ink:#0d1312; --shadow:none;
}
/* Suave: oscuro de baja luz, sin blanco puro, y colores seguros para daltonismo (azul = entra, ámbar = sale) */
[data-theme=suave]{
  --bg:#141618; --card:#1b1e21; --ink:#d6d0c4; --muted:#8c877d; --line:#2a2e32;
  --brand:#6f9cc3; --brand-ink:#11171d; --brand-soft:#1f2933; --in:#7fb0dc; --out:#d9a35f;
  --warn:#c9ac72; --warn-soft:#2b261b; --move:#a596c6;
  --hero:#1f2933; --hero-ink:#d6d0c4; --hero-btn:#6f9cc3; --hero-btn-ink:#11171d;
  --fab:#5f8db5; --bar:#6f9cc3; --toast:#2a2e32; --toast-ink:#d6d0c4; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=suave] body{font-size:16.5px;letter-spacing:.005em}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:21px;margin:0;flex:1;letter-spacing:-.02em}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:700}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
main{padding:4px 16px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--brand);font-weight:700}
nav button.fab span.c{width:54px;height:54px;border-radius:18px;background:var(--fab);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
[data-theme=suave] nav button.fab span.c{color:var(--brand-ink);box-shadow:none}
nav button.fab svg{width:28px;height:28px}
nav .badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--out);color:var(--brand-ink);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:800}
[data-theme=light] nav .badge{color:#fff}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .r{margin-left:auto;font-size:13px;font-weight:600}
.hero{background:var(--hero);color:var(--hero-ink);border:0;padding:18px}
.hero .k{opacity:.85;font-size:13px;font-weight:600}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.hero .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.92}
.hero .sub b{display:block;font-size:16px}
.btn.inv{background:var(--hero-btn);color:var(--hero-btn-ink)}
.accs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;scroll-snap-type:x mandatory}
.accs::-webkit-scrollbar{display:none}
.acc{flex:0 0 150px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.acc .e{font-size:20px}.acc .n{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.acc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brand);font-weight:700;border-style:dashed;box-shadow:none}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:6px}
.bar i.over{background:var(--out)}
.cats .c{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0;font-size:14px}
.cats .c .bar{grid-column:1/-1;height:7px;margin:0}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;padding:10px 4px;border-radius:10px;background:none;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.out{color:var(--out)} .seg button.on.in{color:var(--in)} .seg button.on.mv{color:var(--move)}
.amount{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 0}
.amount span{font-size:28px;color:var(--muted)}
.amount input{border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:36px;font-weight:800;width:100%;font-variant-numeric:tabular-nums}
.amount:focus-within{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.chip.add{color:var(--brand);font-weight:700;border-style:dashed}
input.txt,select.txt{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 12px;font:inherit}
input.txt:focus,select.txt:focus{outline:2px solid var(--brand);outline-offset:-1px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;font-weight:800;font-size:17px;background:var(--brand);color:var(--brand-ink);margin-top:16px}
.btn.sec{background:var(--line);color:var(--ink);font-weight:700;font-size:15px;padding:12px}
.btn.danger{background:none;color:var(--out);border:1px solid var(--out);font-size:15px;padding:12px}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--brand);font-weight:700;padding:4px 0}
details summary{color:var(--brand);font-weight:700;margin-top:14px;cursor:pointer;font-size:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.in{color:var(--in)} .out{color:var(--out)} .mv{color:var(--move)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:36px;height:36px;border-radius:11px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 36px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted)}
.item .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .v small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.ibtn{border:0;background:var(--line);border-radius:9px;width:34px;height:34px;font-size:15px;flex:0 0 34px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--line);color:var(--muted);margin-left:4px;font-weight:700}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.late{background:var(--out);color:var(--brand-ink)} .tag.ok{background:var(--brand-soft);color:var(--brand)}
[data-theme=light] .tag.late{color:#fff}
.day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 2px 4px}
.month{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.month b{font-size:17px}
.month button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:36px;font-size:18px}
.month button:disabled{opacity:.3}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700}
.kpi .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.wide{grid-column:1/-1}
.payb{border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:14px;padding:8px 12px}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.note{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.note.warn{background:var(--warn-soft)}
.split{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.split b{color:var(--ink);font-size:15px;display:block}
.split b.out{color:var(--out)} .split b.in{color:var(--in)}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14.5px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
.sect{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sect .t{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.big2{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)} .dots i.on{background:var(--brand);width:16px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
dialog{border:0;border-radius:20px;padding:18px;width:min(94vw,440px);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 4px;font-size:18px}
.hide{display:none!important}
.hdrbtn{border:0;background:none;color:var(--muted);padding:4px;display:flex}
.hdrbtn svg{width:24px;height:24px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <h1 id="title">Inicio</h1>
  <span id="mode" class="pill demo">Demo</span>
  <button class="hdrbtn" id="eye" aria-label="Mostrar u ocultar saldos"></button>
  <button class="hdrbtn" id="gear" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<main id="main"></main>
<nav id="nav">
  <button data-v="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Movimientos</button>
  <button data-v="registrar" class="fab" aria-label="Registrar"><span class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-v="pagar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Por pagar<span id="badge" class="badge hide"></span></button>
  <button data-v="tarjeta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Tarjeta</button>

<script>
/* =========================================================
   LISTAS INICIALES (para personas nuevas). Cada quien las
   ajusta en Ajustes → Categorías y conceptos. A quien ya tiene
   historial, la app le arma las suyas con lo que ha usado.
   ========================================================= */
const DEFAULTS = {
  v: 3,
  categorias: { Egreso: ['Gastos','Servicios','Ahorros','Ayudas','Deudas'], Ingreso: ['Sueldo','Otros'] },
  conceptos: {
    Gastos: ['Mercado','Transporte','Almuerzo','Salidas','Ropa'],
    Servicios: ['Arriendo','Luz','Agua','Gas','Internet','Celular'],
    Ahorros: ['Ahorro'], Ayudas: ['Familia'], Deudas: ['Tarjeta Crédito'],
    Sueldo: ['Nómina'], Otros: ['Devolución']
  },
  ocultos: {}, fijas: ['Servicios','Ayudas','Ahorros','Deudas'], presupuestos: []
};
const TIPOS_CUENTA = {
  banco:{e:'🏦',n:'Cuenta de banco'}, cajita:{e:'📦',n:'Cajita / bolsillo'}, efectivo:{e:'💵',n:'Efectivo'},
  tarjeta:{e:'💳',n:'Tarjeta de crédito'}, deuda:{e:'🤝',n:'Le debo a alguien'}, prestamo:{e:'🧑',n:'Persona (cruzamos cuentas)'}
};
const PASIVO = t => t==='tarjeta' || t==='deuda';
const CATS_MOVER = ['Ahorros','Pago tarjeta','Pago deuda','Cruce de cuentas','Me pagaron','Transferencia'];
const METODOS_SIN_CUENTAS = ['Débito','Crédito','Saldo favor'];

/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const v=Math.round(Number(n)||0); return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('es-CO'); };
/* Saldos ocultos: muestra $ •••••• en vez de los saldos de cuentas, cajitas, tarjeta y cruces */
let PRIV = (()=>{ try{ return JSON.parse(localStorage.getItem('mc_priv_inicio')||'false') || JSON.parse(localStorage.getItem('mc_priv')||'false'); }catch(e){ return false; } })();
const fmtP = n => PRIV ? '$ ••••••' : fmt(n);
const today = () => new Date().toLocaleDateString('en-CA');
const nowStamp = () => new Date().toISOString().replace('T',' ');
const ym = d => d.slice(0,7);
const addMonths = (m,k) => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1+k,1).toLocaleDateString('en-CA').slice(0,7); };
const addDays = (d,k) => { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd+k).toLocaleDateString('en-CA'); };
const daysBetween = (a,b) => { const p=s=>{const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d);}; return Math.round((p(b)-p(a))/864e5); };
const monthName = m => { const [y,mo]=m.split('-').map(Number); const t=new Date(y,mo-1,1).toLocaleDateString('es-CO',{month:'long'}); return t[0].toUpperCase()+t.slice(1)+' '+y; };
const monthShort = m => monthName(m).split(' ')[0];
const dayLabel = d => { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}); };
const shortDate = d => { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('es-CO',{day:'numeric',month:'short'}); };
const digits = s => String(s||'').replace(/\D/g,'');
const parseMoney = s => { const d=digits(s); return d ? Number(d) : null; };
const moneyStr = n => n ? Number(n).toLocaleString('es-CO') : '';
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-6);
const sum = (a,f=x=>x.monto||0) => a.reduce((s,x)=>s+(Number(f(x))||0),0);
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k);}catch(e){} }
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function moneyInput(el){ if(!el) return; el.addEventListener('input',()=>{ const d=digits(el.value); el.value=d?Number(d).toLocaleString('es-CO'):''; }); }
function clampDay(m,dia){ const [y,mo]=m.split('-').map(Number); const last=new Date(y,mo,0).getDate(); return `${m}-${String(Math.min(dia,last)).padStart(2,'0')}`; }
function nextDay(dia){ if(!dia) return null; const t=today(); let m=ym(t); for(let i=0;i<3;i++){ const d=clampDay(m,dia); if(d>=t) return d; m=addMonths(m,1); } return null; }
async function enLotes(items, fn, onProg, n=6){ let ok=0,fail=0; for(let i=0;i<items.length;i+=n){ await Promise.all(items.slice(i,i+n).map(async x=>{ try{ await fn(x); ok++; }catch(e){ fail++; console.warn(e); } })); onProg&&onProg(ok+fail,items.length); } return {ok,fail}; }

/* ---------- tema ---------- */
function applyTheme(t){ ls.set('mc_theme',t); const d=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;

function match(r,q){ if(q.from&&r.fecha<q.from) return false; if(q.to&&r.fecha>=q.to) return false; if(q.estado&&r.estado!==q.estado) return false; return true; }
const PB = {

  get url(){ return (ls.get('mc_url','')||'').trim().replace(/\/_\/?.*$/,'').replace(/\/+$/,''); },
  get token(){ return ls.get('mc_token',''); }, get userId(){ return ls.get('mc_user',''); },
  async req(path,opt={}){

    if(res.status===204) return null; const body=await res.json().catch(()=>({}));

  async login(url,email,pass){ ls.set('mc_url',url.trim());

  logout(){ ls.del('mc_token'); ls.del('mc_user'); },
  from(c,x){ const o={...x}; for(const f of DATE_FIELDS[c]) o[f]=(o[f]||'').slice(0,10);

    if('presupuesto' in o) o.presupuesto=o.presupuesto||0; if('monto' in o) o.monto=o.monto||0; return o; },
  async list(c,q={}){ const fl=[]; if(q.from) fl.push(`fecha >= "${q.from} 00:00:00"`); if(q.to) fl.push(`fecha < "${q.to} 00:00:00"`); if(q.estado) fl.push(`estado = "${q.estado}"`);
    const out=[]; let page=1;
    while(true){ const p=new URLSearchParams({page,perPage:500,...(fl.length?{filter:fl.join(' && ')}:{}),...(c==='movimientos'?{sort:'-fecha,-created'}:{})});
      const r=await this.req(`/api/collections/${c}/records?`+p); out.push(...r.items.map(x=>this.from(c,x))); if(page>=r.totalPages) break; page++; }
    return out; },
  async create(c,r){ return this.from(c, await this.req(`/api/collections/${c}/records`,{method:'POST',body:JSON.stringify({...this.to(c,r),usuario:this.userId})})); },
  async update(c,id,p){ return this.from(c, await this.req(`/api/collections/${c}/records/${id}`,{method:'PATCH',body:JSON.stringify(this.to(c,p))})); },
  async remove(c,id){ await this.req(`/api/collections/${c}/records/${id}`,{method:'DELETE'}); }
};

/* Arma tus categorías y conceptos con lo que has usado (una sola vez) */
async function migrarPerfil(){
  const base=JSON.parse(JSON.stringify(PERFIL.config&&PERFIL.config.categorias?PERFIL.config:DEFAULTS));
  const C={...JSON.parse(JSON.stringify(DEFAULTS)),...base,v:3}; C.ocultos=C.ocultos||{}; C.presupuestos=C.presupuestos||[]; C.fijas=C.fijas||DEFAULTS.fijas;
  let todos=[]; try{ todos=await S.list('movimientos'); }catch(e){}
  if(todos.length){
    const usadas={Egreso:{},Ingreso:{}}; const conc={};
    for(const m of todos){ if(!usadas[m.tipo]||!m.categoria||m.categoria==='Ajuste') continue; usadas[m.tipo][m.categoria]=(usadas[m.tipo][m.categoria]||0)+1;
      if(m.concepto){ conc[m.categoria]=conc[m.categoria]||{}; conc[m.categoria][m.concepto]=(conc[m.categoria][m.concepto]||0)+1; } }
    // si tiene historial, sus categorías son las que usó (más las que ya tenía guardadas)
    for(const t of ['Egreso','Ingreso']){ const u=Object.keys(usadas[t]).sort((a,b)=>usadas[t][b]-usadas[t][a]);
      const prev=PERFIL.config&&PERFIL.config.categorias?C.categorias[t]:[]; C.categorias[t]=[...new Set([...prev,...u])]; if(!C.categorias[t].length) C.categorias[t]=DEFAULTS.categorias[t]; }
    for(const [cat,o] of Object.entries(conc)){ const top=Object.keys(o).sort((a,b)=>o[b]-o[a]).slice(0,20); const prev=(PERFIL.config&&PERFIL.config.conceptos||{})[cat]||[];
      const seen=new Set(); C.conceptos[cat]=[...prev,...top].filter(x=>{ const k=x.trim().toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; }); }
  }
  PERFIL.config=C; try{ await savePerfil({}); }catch(e){}
}
async function savePerfil(p){ Object.assign(PERFIL,p); const data={nombre:PERFIL.nombre||'',config:PERFIL.config};
  if(PERFIL.id) await S.update('perfiles',PERFIL.id,data); else PERFIL.id=(await S.create('perfiles',data)).id; }
async function movsMes(m){ if(m+'-01'>=LOADED_FROM) return MOVS.filter(x=>ym(x.fecha)===m);
  if(!MCACHE[m]) MCACHE[m]=await S.list('movimientos',{from:m+'-01',to:addMonths(m,1)+'-01'}); return MCACHE[m]; }

/* ---------- saldos ----------
   Cada cuenta parte de su saldo inicial en "desde" y suma/resta lo posterior.
   Tarjeta y "le debo": el saldo es lo que DEBES. Lo importado del Excel es historial: no cambia saldos. */
/* ¿Este movimiento cambia el saldo de la cuenta c?
   - Lo anterior a la fecha "desde" de la cuenta ya está en su saldo inicial (no cuenta).
   - Lo marcado como "ya descontado" o importado del Excel es historial (no cuenta).
   - Persona (cruce): es un libro de cuentas; cuenta todo desde su fecha "desde". */
function incluye(m,c){
  if(c.tipo==='prestamo') return m.fecha>=c.desde;
  if(m.origen==='excel'||m.origen==='historial') return false;
  if(m.fecha>c.desde) return true; if(m.fecha<c.desde) return false; return (m.created||'')>=(c.created||''); }
function saldos(){
  const s={}; CUENTAS.forEach(c=>s[c.id]=Number(c.saldo_inicial)||0);
  const ap=(id,m,dir)=>{ const c=cuenta(id); if(!c||!incluye(m,c)) return; s[id]+=(PASIVO(c.tipo)?-dir:dir)*(Number(m.monto)||0); };
  for(const m of MOVS){ if(m.estado==='pendiente') continue;
    if(m.tipo==='Transferencia'){ ap(m.cuenta,m,-1); ap(m.destino,m,+1); } else if(m.tipo==='Ingreso') ap(m.cuenta,m,+1); else { ap(m.cuenta,m,-1); if(m.destino) ap(m.destino,m,+1); } }
  return s;
}
/* Compras con tarjeta que aún no separaste: las nuevas y las del extracto/ciclo vigentes (aunque vengan del Excel) */
function porSeparar(t){ const c=ciclo(t); const desde=c?c.ext.desde:'9999';
  return MOVS.filter(m=>m.tipo==='Egreso'&&m.estado==='pagado'&&m.cuenta===t.id&&!m.separado&&(incluye(m,t)||m.fecha>=desde)); }
const tcCfg = t => ((cfg().tc||{})[t.id])||{};
const mesesEntre = (a,b) => { const [ya,ma]=a.split('-').map(Number), [yb,mb]=b.split('-').map(Number); return (yb-ya)*12+(mb-ma); };
/* Cajita de cada ciclo: si alternas dos cajitas (una por ciclo), se turnan mes a mes */
function cajitaDe(t,hasta){ const c=tcCfg(t);
  if(c.alt&&c.alt.length===2&&c.base&&hasta){ const k=((mesesEntre(c.base,ym(hasta))%2)+2)%2; return cuenta(c.alt[k])||cuenta(t.cajita); }
  return cuenta(t.cajita); }

/* ---------- ciclo de la tarjeta (corte y pago) ----------
   Ej: corte 15, pago 3 → compras del 16 oct al 15 nov se pagan hasta el 3 dic. */
/* El banco a veces corta unos días antes o después: se puede ajustar la fecha real de cada corte */
function corteDe(t,m){ const o=(tcCfg(t).cortes||{})[m]; return o||clampDay(m,Number(t.corte_dia)); }
function corteHasta(d,t){ const c=corteDe(t,ym(d)); return c<=d?c:corteDe(t,addMonths(ym(d),-1)); }
function ciclo(t){
  const dia=Number(t.corte_dia)||0, pd=Number(t.pago_dia)||0; if(!dia) return null;
  const hoy=today(); const last=corteHasta(addDays(hoy,-1),t), prev=corteHasta(addDays(last,-1),t), next=corteDe(t,addMonths(ym(last),1));
  const pagoDe=c=>pd?clampDay(pd>Number(c.slice(8))?ym(c):addMonths(ym(c),1),pd):null;
  const compras=(a,b)=>MOVS.filter(m=>m.tipo==='Egreso'&&m.estado==='pagado'&&m.cuenta===t.id&&m.fecha>a&&m.fecha<=b);
  const ext={desde:addDays(prev,1),hasta:last,pago:pagoDe(last)}; ext.compras=compras(prev,last); ext.total=sum(ext.compras);
  ext.pagado=sum(MOVS.filter(m=>m.estado==='pagado'&&m.tipo==='Transferencia'&&m.destino===t.id&&m.fecha>last));
  ext.pendiente=Math.min(Math.max(ext.total-ext.pagado,0),Math.max(saldos()[t.id]||0,0)); // nunca más de lo que debes en total
  const act={desde:addDays(last,1),hasta:next,pago:pagoDe(next)}; act.compras=compras(last,next); act.total=sum(act.compras);
  return {ext,act};
}
/* Pagos que la app calcula sola: extracto de tarjeta y deudas con alguien */
function pendVirtuales(){
  const out=[]; const sal=saldos();
  for(const t of tarjetas()){ const c=ciclo(t); if(c&&c.ext.pendiente>0&&c.ext.pago)
    out.push({virtual:'tc',id:'v_'+t.id,cta:t,concepto:`Pago ${t.nombre}`,categoria:'Tarjeta de crédito',vence:c.ext.pago,valor:c.ext.pendiente,sub:`Extracto ${shortDate(c.ext.desde)} – ${shortDate(c.ext.hasta)}`}); }
  for(const d of CUENTAS.filter(c=>c.tipo==='deuda'&&sal[c.id]>0))
    out.push({virtual:'deuda',id:'v_'+d.id,cta:d,concepto:d.nombre,categoria:'Deuda',vence:d.pago_dia?nextDay(d.pago_dia):'',valor:sal[d.id],sub:'Lo que le debes'});
  for(const p of personas().filter(c=>sal[c.id]<0))
    out.push({virtual:'persona',id:'v_'+p.id,cta:p,concepto:`Cuadrar con ${p.nombre}`,categoria:'Cruce de cuentas',vence:'',valor:-sal[p.id],sub:'Cruce de cuentas: le debes'});
  return out;
}

/* ---------- resumen y plan del mes ---------- */
function resumenMes(list,m){
  const sinAj=list.filter(r=>r.categoria!=='Ajuste');
  const pag=sinAj.filter(r=>r.estado==='pagado'), pen=sinAj.filter(r=>r.estado==='pendiente');
  const ing=sum(pag.filter(r=>r.tipo==='Ingreso')); const egTodo=pag.filter(r=>r.tipo==='Egreso'); const eg=egTodo.filter(r=>!r.destino); const porOtros=sum(egTodo.filter(r=>r.destino));
  const egr=sum(eg), cred=sum(eg.filter(r=>r.metodo==='Crédito'));
  const cats={}; eg.forEach(r=>cats[r.categoria]=(cats[r.categoria]||0)+(r.monto||0));
  const ahorro=sum(pag.filter(r=>r.categoria==='Ahorros'&&(r.tipo==='Transferencia'||r.tipo==='Egreso')));
  const pend=sum(pen.filter(r=>r.tipo==='Egreso'),r=>r.presupuesto);
  // Plan: lo que entra − lo fijo (ahorros, servicios… pagados o por pagar) = libre para gastar
  const ingPlan=ing+sum(pen.filter(r=>r.tipo==='Ingreso'),r=>r.presupuesto);
  const fijos=sum(eg.filter(r=>esFija(r.categoria)))+sum(pen.filter(r=>r.tipo==='Egreso'&&esFija(r.categoria)),r=>r.presupuesto)
    +sum(pag.filter(r=>r.tipo==='Transferencia'&&r.categoria==='Ahorros'));
  const libre=ingPlan-fijos;
  const varGast=sum(eg.filter(r=>!esFija(r.categoria))), varPend=sum(pen.filter(r=>r.tipo==='Egreso'&&!esFija(r.categoria)),r=>r.presupuesto);
  const queda=libre-varGast-varPend;
  const hoy=today(); const [y,mo]=m.split('-').map(Number); const dias=m===ym(hoy)?(new Date(y,mo,0).getDate()-Number(hoy.slice(8))+1):0;
  const pres=(cfg().presupuestos||[]).map(p=>({...p,gastado:sum(egTodo.filter(r=>r.categoria===p.categoria&&(!p.concepto||r.concepto.toLowerCase()===p.concepto.toLowerCase())))}));
  return {ing,egr,cred,cats,ahorro,pend,ingPlan,fijos,libre,varGast,varPend,queda,dias,pres,porOtros};
}

/* ================= INICIO ================= */
async function viewInicio(){
  const sal=saldos();
  const disp=sum(CUENTAS.filter(c=>c.tipo==='banco'||c.tipo==='efectivo'),c=>sal[c.id]);
  const caj=sum(CUENTAS.filter(c=>c.tipo==='cajita'),c=>sal[c.id]);
  const debes=sum(CUENTAS.filter(c=>PASIVO(c.tipo)),c=>sal[c.id])+sum(personas().filter(c=>sal[c.id]<0),c=>-sal[c.id]);
  const teDeben=sum(personas().filter(c=>sal[c.id]>0),c=>sal[c.id]);
  const hola=PERFIL.nombre?`Hola, ${esc(PERFIL.nombre)} 👋`:'Hola 👋';
  let h='';
  if(!CUENTAS.length){
    h+=`<div class="card hero"><div class="k">${hola}</div><div class="big" style="font-size:22px">Empieza creando tus cuentas</div>
      <div class="sub" style="display:block">Agrega tu cuenta de banco, tus cajitas, tu tarjeta y tus deudas con el saldo que tienen hoy. Así la app te dice cuánto debería haber en cada una.</div>
      <button class="btn inv" id="addacc">Agregar mi primera cuenta</button></div>`;
  } else {
    h+=`<div class="card hero"><div class="k">${hola} · Disponible en cuentas</div><div class="big">${fmtP(disp)}</div>
      <div class="sub"><div>En cajitas<b>${fmtP(caj)}</b></div>${debes?`<div>Debes<b>${fmtP(debes)}</b></div>`:''}${teDeben?`<div>Te deben<b>${fmtP(teDeben)}</b></div>`:''}</div></div>
    <div class="accs">${CUENTAS.map(c=>`<button class="acc" data-acc="${c.id}"><div class="e">${TIPOS_CUENTA[c.tipo]?.e||'•'}</div><div class="n">${esc(c.nombre)}</div><div class="v ${PASIVO(c.tipo)||sal[c.id]<0?'out':''}">${fmtP(sal[c.id])}</div></button>`).join('')}
      <button class="acc add" id="addacc">＋<span class="small">Agregar</span></button></div>`;
  }
  h+=`<div id="mwrap">${await monthCard(st.home)}</div>`;

function tarjetaCard(t,sal,compact){

  if(c){
    const dias=c.ext.pago?daysBetween(hoy,c.ext.pago):null; const venc=dias!=null&&dias<0&&c.ext.pendiente>0;
    const falta=Math.max(c.ext.pendiente-enCaj,0); const pct=c.ext.pendiente>0?Math.min(100,enCaj/c.ext.pendiente*100):100;
    h+=`<div class="small muted">Extracto del ${shortDate(c.ext.desde)} al ${shortDate(c.ext.hasta)} (corte ${shortDate(c.ext.hasta)})</div>

        <div style="text-align:right">${c.ext.pago?(venc?'<b class="out">¡Vencido!</b>':`Pagar antes del<b>${shortDate(c.ext.pago)}</b>`):'Día de pago<b>—</b>'}</div></div>
      ${c.ext.pendiente?`${caj?`<div class="bar"><i style="width:${Math.max(2,pct)}%"></i></div><div class="small muted">${falta?`Te falta separar ${fmtP(falta)}${dias!=null&&dias>=0?` · quedan ${dias} días`:''}`:'✅ Ya tienes en la cajita lo del extracto'}</div>`:''}`
        :`<div class="note">✅ Extracto pagado${c.ext.pagado?` (${fmt(c.ext.pagado)})`:''}.</div>`}
      <div class="sect"><div class="t">Ciclo actual: ${shortDate(c.act.desde)} – ${shortDate(c.act.hasta)}</div>
        <div class="split"><div>Compras<b>${fmt(c.act.total)}</b></div>${cajAct&&cajAct.id!==caj?.id?`<div>En ${esc(cajAct.nombre)}<b>${fmtP(sal[cajAct.id])}</b></div>`:''}<div style="text-align:right">Se paga el<b>${c.act.pago?shortDate(c.act.pago):'—'}</b></div></div></div>`;
    if(!c.ext.compras.length&&!c.act.compras.length) h+=`<div class="note warn">No veo compras enlazadas a esta tarjeta. Si importaste tu historial, ve a <b>Ajustes → Relacionar historial</b> para enlazar las compras con crédito.</div>`;

  return h+'</div>';

  return h;

function conceptosDe(cat,max=14){
  const ocul=new Set(((cfg().ocultos||{})[cat]||[]).map(x=>x.toLowerCase())); const freq={};
  MOVS.filter(r=>r.categoria===cat&&r.concepto).forEach(r=>freq[r.concepto]=(freq[r.concepto]||0)+1);
  const seen=new Set(), out=[];
  for(const c of [...((cfg().conceptos||{})[cat]||[]),...Object.keys(freq).sort((a,b)=>freq[b]-freq[a])]){ const k=c.trim().toLowerCase(); if(!k||seen.has(k)||ocul.has(k)) continue; seen.add(k); out.push(c.trim()); }
  return out.slice(0,max);
}

async function guardar(){

/* Fijos del mes anterior: eliges uno por uno si queda pendiente, si ya lo pagaste o si no aplica este mes */
async function traerFijos(){
  const cur=ym(today()), prev=addMonths(cur,-1); const antes=MOVS.filter(m=>ym(m.fecha)===prev), ahora=MOVS.filter(m=>ym(m.fecha)===cur);
  const key=r=>(r.categoria+'|'+r.concepto).toLowerCase(); const omit=new Set(((cfg().fijosOmitidos||{})[cur])||[]);
  const ya=new Set(ahora.map(key)), vistos=new Set(), items=[];
  const enCruce=new Set(Object.values(cfg().cruces||{}).flatMap(x=>(x.cargos||[]).map(c=>(c.categoria+'|'+c.concepto).toLowerCase())));
  for(const r of antes){ if(r.tipo!=='Egreso'||!esFija(r.categoria)||r.destino||r.metodo==='Cruce') continue; const k=key(r); if(enCruce.has(k)) continue; if(ya.has(k)||vistos.has(k)||omit.has(k)) continue; vistos.add(k);
    const v=r.presupuesto||r.monto; if(!v) continue; const f=`${cur}-${r.fecha.slice(8,10)>'28'?'28':r.fecha.slice(8,10)}`;
    items.push({k,accion:'pend',r:{fecha:f,vence:f,tipo:'Egreso',categoria:r.categoria,concepto:r.concepto,metodo:r.metodo,cuenta:r.cuenta||'',destino:'',estado:'pendiente',presupuesto:v,monto:null,separado:false,nota:''}}); }
  if(!items.length){ toast('No hay fijos nuevos para traer'); return; }
  const lista=CUENTAS.filter(c=>c.tipo!=='prestamo'||true); let cid=lista.find(c=>c.tipo==='banco')?.id||lista[0]?.id||''; const d=$('#dlg');
  const draw=()=>{ d.innerHTML=`<h3>Pagos fijos de ${monthShort(prev).toLowerCase()}</h3><p class="small muted" style="margin:0 0 6px">Elige qué pasa con cada uno este mes.</p>
    <ul class="list">${items.map((x,i)=>`<li class="item" style="flex-wrap:wrap"><div class="main"><div class="t">${esc(x.r.concepto)}</div><div class="s">${esc(x.r.categoria)} · ${fmt(x.r.presupuesto)}</div></div>
      <div class="seg" data-i="${i}" style="flex:1 1 100%;margin-top:6px">${[['pend','Pendiente'],['pag','Ya lo pagué'],['no','No este mes']].map(([a,n])=>`<button data-a="${a}" class="${x.accion===a?'on':''}">${n}</button>`).join('')}</div></li>`).join('')}</ul>
    ${items.some(x=>x.accion==='pag')&&lista.length?`<label class="lbl">Los que ya pagaste, ¿con qué?</label>${chipsCuentas('fcta',lista,cid)}<p class="small muted">Se registran como pagados hoy. Si fue en otra fecha o por otro valor, edítalos después.</p>`:''}
    <button class="btn" id="fok">Aplicar</button><button class="btn sec" id="fno">Cancelar</button>`;
    d.querySelectorAll('.seg[data-i]').forEach(sg=>sg.onclick=e=>{ const a=e.target.closest('button')?.dataset.a; if(!a) return; items[Number(sg.dataset.i)].accion=a; draw(); });
    bindChips('#fcta',id=>cid=id); $('#fno').onclick=()=>d.close();
    $('#fok').onclick=async()=>{ $('#fok').disabled=true;
      try{ for(const x of items){
          if(x.accion==='pend') MOVS.unshift(await S.create('movimientos',x.r));
          else if(x.accion==='pag'){ const met=metodoDe('Egreso',cid)||x.r.metodo; MOVS.unshift(await S.create('movimientos',{...x.r,estado:'pagado',monto:x.r.presupuesto,fecha:today(),vence:'',cuenta:cid,metodo:met,separado:false})); } }
        const no=items.filter(x=>x.accion==='no').map(x=>x.k);
        if(no.length){ const C=JSON.parse(JSON.stringify(cfg())); C.fijosOmitidos=C.fijosOmitidos||{}; C.fijosOmitidos[cur]=[...new Set([...(C.fijosOmitidos[cur]||[]),...no])];
          for(const m of Object.keys(C.fijosOmitidos)) if(m<addMonths(cur,-2)) delete C.fijosOmitidos[m]; await savePerfil({config:C}); }
        d.close(); toast('Listo'); refreshBadge(); render(); }catch(e){ toast(e.status?e.message:'Sin conexión'); $('#fok').disabled=false; } }; };
  draw(); d.showModal();
}

async function viewMovs(){

  const R=resumenMes(list,m); const q=st.q.toLowerCase();

  <input class="txt" id="q" placeholder="Buscar concepto, categoría, cuenta…" value="${esc(st.q)}">`;
  if(!shown.length) return h+`<div class="empty">Sin movimientos ${q?'para esa búsqueda':'este mes'}.</div>`;
  let day='';
  for(const r of shown){
    if(r.fecha!==day){ if(day) h+='</ul></div>'; day=r.fecha; h+=`<div class="day">${dayLabel(day)}</div><div class="card" style="padding:2px 12px"><ul class="list">`; }
    const pend=r.estado==='pendiente', mv=r.tipo==='Transferencia'; const v=pend?r.presupuesto:(r.monto||r.presupuesto); const c=cuenta(r.cuenta), dst=cuenta(r.destino);
    const ic=mv?(r.categoria==='Ahorros'?'🐷':'↔️'):r.tipo==='Ingreso'?'⬇️':r.metodo==='Crédito'?'💳':r.categoria==='Ajuste'?'⚖️':'🧾';
    const sub=mv?`${esc(c?.nombre||'?')} → ${esc(dst?.nombre||'?')} · ${esc(r.categoria)}`:`${esc(r.categoria)} · ${esc(c?.nombre||r.metodo)}${dst?` · por ${esc(dst.nombre)}`:''}`;

    h+=`<li class="item" data-id="${r.id}"><div class="ic">${ic}</div><div class="main"><div class="t">${esc(r.concepto)||'<span class="muted">(sin concepto)</span>'}</div><div class="s">${sub}${tags}</div></div>

  }
  return h+'</ul></div>';
}

    if($('#cdel')) $('#cdel').onclick=async()=>{ if(C.categorias[tipo].length<=1){ toast('Debe quedar al menos una'); return; }
      if(!confirm(`¿Quitar "${nombre}" de la lista? Tus movimientos anteriores no se borran.`)) return;
      C.categorias[tipo]=C.categorias[tipo].filter(c=>c!==nombre); C.fijas=(C.fijas||[]).filter(c=>c!==nombre); await savePerfil({config:C}); d.close(); render(); };
    $('#cok').onclick=async()=>{ const nn=$('#cnm').value.trim(); if(!nn){ toast('Ponle un nombre'); return; }
      if(nn!==nombre&&C.categorias[tipo].includes(nn)){ toast('Ya existe esa categoría'); return; }
      const aplicar=$('#capl')?.checked; fija=$('#cfija')?.checked;
      if(nueva) C.categorias[tipo].push(nn); else C.categorias[tipo]=C.categorias[tipo].map(c=>c===nombre?nn:c);
      C.conceptos=C.conceptos||{}; C.ocultos=C.ocultos||{};
      if(!nueva&&nn!==nombre){ delete C.conceptos[nombre]; C.ocultos[nn]=C.ocultos[nombre]||[]; delete C.ocultos[nombre]; (C.presupuestos||[]).forEach(p=>{ if(p.categoria===nombre) p.categoria=nn; }); }
      C.conceptos[nn]=lista; C.ocultos[nn]=[...new Set([...(C.ocultos[nn]||[]),...quitados,...Object.keys(renames)])].filter(x=>!lista.includes(x));
      C.fijas=(C.fijas||[]).filter(c=>c!==nombre&&c!==nn); if(fija) C.fijas.push(nn);
      $('#cok').disabled=true;
      try{ await savePerfil({config:C});
        if(!nueva&&aplicar&&(nn!==nombre||Object.keys(renames).length)){
          const todos=(await S.list('movimientos')).filter(m=>m.categoria===nombre&&(m.tipo===tipo||(tipo==='Egreso'&&m.tipo==='Transferencia')));
          const cambios=todos.map(m=>({id:m.id,p:{categoria:nn,...(renames[m.concepto]?{concepto:renames[m.concepto]}:{})}})).filter(x=>x.p.categoria!==nombre||x.p.concepto);
          toast(`Actualizando ${cambios.length} movimientos…`);
          await enLotes(cambios,x=>S.update('movimientos',x.id,x.p),(n,t)=>{ $('#cok').textContent=`Actualizando ${n}/${t}…`; },S===PB?6:1);
          await reload(); }
        d.close(); toast('Categoría guardada'); render(); }catch(e){ toast(e.status?e.message:'Sin conexión'); $('#cok').disabled=false; } };
  };
  let nombre_tmp=nombre||''; draw(); d.showModal();
}
function presupuestoDlg(){
  const cats=cfg().categorias.Egreso; let cat=cats.find(c=>!esFija(c))||cats[0]; const d=$('#dlg');
  const draw=()=>{ d.innerHTML=`<h3>Nuevo presupuesto mensual</h3><label class="lbl">Categoría</label><div class="chips" id="pcat">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="lbl">Concepto (opcional)</label><input class="txt" id="pcon" placeholder="Ej: Mercado (vacío = toda la categoría)">
    <div class="chips" id="pcons" style="margin-top:8px">${conceptosDe(cat,10).map(c=>`<button class="chip" data-k="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="lbl">Tope al mes</label><div class="amount"><span>$</span><input id="pmon" inputmode="numeric" placeholder="0"></div>
    <button class="btn" id="pok">Guardar</button><button class="btn sec" id="pno">Cancelar</button>`;
    moneyInput($('#pmon'));
    $('#pcat').onclick=e=>{ const c=e.target.closest('button')?.dataset.c; if(!c) return; cat=c; draw(); };
    $('#pcons').onclick=e=>{ const k=e.target.closest('button')?.dataset.k; if(!k) return; $('#pcon').value=k; };
    $('#pno').onclick=()=>d.close();
    $('#pok').onclick=async()=>{ const monto=parseMoney($('#pmon').value); if(!monto){ toast('Escribe el tope'); return; }
      const C=JSON.parse(JSON.stringify(cfg())); C.presupuestos=C.presupuestos||[]; C.presupuestos.push({categoria:cat,concepto:$('#pcon').value.trim(),monto});
      try{ await savePerfil({config:C}); d.close(); toast('Presupuesto guardado'); render(); }catch(e){ toast(e.message); } }; };
  draw(); d.showModal();
}
/* ---------- relacionar historial importado con cuentas ---------- */
async function relacionarDlg(){
  const d=$('#dlg'); d.innerHTML='<p>Revisando tu historial…</p>'; d.showModal();
  let todos; try{ todos=(await S.list('movimientos')).filter(m=>!m.cuenta&&m.tipo!=='Transferencia'); }catch(e){ d.close(); toast('Sin conexión'); return; }
  const grupos={}; for(const m of todos){ const k=m.tipo==='Ingreso'?'Ingresos':m.metodo||'Débito'; (grupos[k]=grupos[k]||[]).push(m); }
  const opts=k=>{ const l=k==='Crédito'?tarjetas():k==='Ingresos'?origenesPago():CUENTAS.filter(c=>c.tipo!=='prestamo'&&c.tipo!=='tarjeta');
    const def=k==='Crédito'?l[0]?.id:k==='Saldo favor'?'':(l.find(c=>c.tipo==='banco')?.id||l[0]?.id||'');
    return `<select class="txt" data-g="${esc(k)}"><option value="">No relacionar</option>${l.map(c=>`<option value="${c.id}" ${c.id===def?'selected':''}>${esc(accLabel(c))}</option>`).join('')}</select>`; };
  const ks=Object.keys(grupos);
  d.innerHTML=`<h3>Relacionar historial</h3><p class="small muted" style="margin:0">Hay ${todos.length} movimientos sin cuenta. Elige a qué cuenta pertenece cada grupo.</p>
    ${ks.length?ks.map(k=>`<label class="lbl">${k==='Ingresos'?'Ingresos recibidos':'Pagado con "'+esc(k)+'"'} · ${grupos[k].length}</label>${opts(k)}`).join(''):'<p>Todo tu historial ya está relacionado ✅</p>'}
    <div class="note">No cambia tus saldos: lo importado se toma como historial. Sirve para ver los extractos de la tarjeta y los movimientos de cada cuenta.</div>
    <div id="relst" class="small" style="margin-top:8px"></div>
    ${ks.length?'<button class="btn" id="rok">Relacionar</button>':''}<button class="btn sec" id="rno">Cerrar</button>`;
  $('#rno').onclick=()=>d.close();
  if($('#rok')) $('#rok').onclick=async()=>{ const plan=[]; d.querySelectorAll('select[data-g]').forEach(s=>{ if(s.value) grupos[s.dataset.g].forEach(m=>plan.push({id:m.id,cuenta:s.value})); });
    if(!plan.length){ toast('No elegiste ninguna cuenta'); return; } $('#rok').disabled=true;
    const r=await enLotes(plan,x=>S.update('movimientos',x.id,{cuenta:x.cuenta}),(n,t)=>$('#relst').textContent=`Relacionando… ${n} de ${t}`,S===PB?6:1);
    await reload(); $('#relst').textContent=`Listo: ${r.ok} relacionados${r.fail?`, ${r.fail} con error`:''}.`; $('#rok').remove(); render(); };
}

/* ================= arranque ================= */
function setMode(){ const p=$('#mode'); if(S===PB){ p.textContent='En línea'; p.className='pill'; } else { p.textContent='Demo'; p.className='pill demo'; } }
function refreshBadge(){ let n=0; try{ n=pendientesTodos().length; }catch(e){} const b=$('#badge'); b.textContent=n; b.classList.toggle('hide',!n); }
(async function init(){
  S=(PB.url&&PB.token)?PB:LocalStore; setMode(); $('#main').innerHTML='<div class="empty">Cargando…</div>';
  if(S===PB){ try{ await PB.refresh(); }catch(e){ if(e.status){ PB.logout(); S=LocalStore; setMode(); toast('Inicia sesión de nuevo en Ajustes'); } } }
  try{ await reload(); await Queue.flush(); render(); }catch(e){ handleErr(e,$('#main')); }
  window.addEventListener('online',()=>Queue.flush());
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(ls.get('mc_theme','auto')==='auto') applyTheme('auto'); });
  if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
